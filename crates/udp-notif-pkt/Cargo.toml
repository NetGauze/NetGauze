lints.workspace = true

[package]
name = "netgauze-udp-notif-pkt"
version = "0.13.0"
edition = "2024"
authors = ["Ahmed Elhassany <a.hassany@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/NetGauze/NetGauze"
homepage = "https://netgauze.io"
description = """
UDP-Notif (draft-ietf-netconf-udp-notif) packet library for YANG Push streaming telemetry. Provides zero-copy wire format handling, automatic JSON/CBOR deserialization, and type-safe access to RFC 8639/8641 subscription notifications.
"""
keywords = ["udp-notif", "netconf", "yang", "yang-push"]
categories = ["network-programming", "parsing"]


[dependencies]
netgauze-parse-utils = { workspace = true, optional = true }
netgauze-netconf-proto = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }

serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
byteorder = { workspace = true, optional = true }
bytes = { workspace = true, features = ["serde"] }
tokio-util = { workspace = true, default-features = false, features = ["codec"], optional = true }
arbitrary = { workspace = true, optional = true }
arbitrary_ext = { workspace = true, optional = true }
serde_json = { workspace = true }
chrono = { workspace = true, default-features = true, features = ["serde"] }
ciborium = { workspace = true }
either = { workspace = true }
criterion = { workspace = true, optional = true }                        # Dev dep for bench

[features]
default = ["serde", "codec"]
serde = ["byteorder", "netgauze-parse-utils"]
codec = ["tokio-util"]
bench = ["criterion", "codec"]
fuzz = ["arbitrary", "arbitrary_ext"]

[dev-dependencies]
netgauze-pcap-reader = { workspace = true }
netgauze-parse-utils = { workspace = true, features = ["test-helpers"] }
serde_json = { workspace = true }
rstest = { workspace = true }
pcap-parser = { workspace = true, features = ["data"] }
ciborium = { workspace = true }

[[bench]]
name = "serde_benchmark"
harness = false
required-features = ["bench"]
